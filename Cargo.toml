[package]
name = "llvbf"
version = "0.1.0"
edition = "2021"
description = "An LLVM backend that compiles LLVM IR to Brainfuck (LLVM 23)"
license = "MIT"

[lib]
name = "llvbf"
path = "src/lib.rs"

[[bin]]
name = "llvbf"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
inkwell = { version = "0.11", features = ["llvm23-1"] }
llvm-sys = "231"

[profile.release]
debug = 1
